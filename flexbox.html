    <title>Flexbox</title>

  <body>
    <div style="display:flex; flex-direction:row;">
      <div style="background-color:lightblue;">div1</div>
      <div style="background-color:lightpink;">div2</div>
    </div>
    <div style="margin-top:12px;display:flex; flex-direction:row;">

      <div style="background-color:lightpink; flex:1;">200px<p style="margin-top:0px;margin-bottom:0px;">ftr</p></div>

    </div>
  </body>
